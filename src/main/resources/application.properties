spring.application.name=com.talllercounter

# H2 a archivo: lo que se guarda sigue ahí después de reiniciar el servicio.
spring.datasource.url=jdbc:h2:file:./data/armas
spring.datasource.username=sa
spring.datasource.password=
# update: crea las tablas si no existen y no borra los datos al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Consola web de H2 en http://localhost:8080/h2-console (solo desarrollo).
spring.h2.console.enabled=true
