spring.application.name=com.talllercounter

# H2 a archivo: lo que se guarda sigue ahí después de reiniciar el servicio.
spring.datasource.url=jdbc:h2:file:./data/armas
spring.datasource.username=sa
spring.datasource.password=
# update: crea las tablas si no existen y no borra los datos al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Consola web de H2 en http://localhost:8080/h2-console (solo desarrollo).
spring.h2.console.enabled=true

# OpenAPI (springdoc): el documento JSON y la página para probarlo en el navegador.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# OpenAPI 3.0: la versión que importan más herramientas (Insomnia, generadores de clientes).
springdoc.api-docs.version=openapi_3_0
# Cada operación documenta solo sus propios errores (no los de todos los handlers).
springdoc.override-with-generic-response=false
# Las respuestas se documentan como JSON.
springdoc.default-produces-media-type=application/json

# POO-09: los servicios de los compañeros. La URL y la ruta se pueden pisar con
# variables de entorno (A2_URL, A2_RUTA, A3_URL, A3_RUTA), sin tocar código.
companeros.espera-conexion-ms=3000
companeros.espera-respuesta-ms=5000
companeros.a2.nombre=Matías Jara (Vanzfranhait)
companeros.a2.url=${A2_URL:http://localhost:8084}
companeros.a2.ruta-disparo-rapido=${A2_RUTA:/api/reglas/disparo-rapido}
companeros.a3.nombre=Joaquín Benegas (joaquinBenegas0)
companeros.a3.url=${A3_URL:http://localhost:8083}
companeros.a3.ruta-danio=${A3_RUTA:/api/reglas/danio}
