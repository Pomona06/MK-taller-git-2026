# Los tests usan una base en memoria: no tocan ./data ni dependen de corridas anteriores.
spring.datasource.url=jdbc:h2:mem:armas-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Compañeros de POO-09: los tests del escenario levantan servidores falsos y
# pisan estas URL; los demás tests no los llaman.
companeros.espera-conexion-ms=1000
companeros.espera-respuesta-ms=2000
companeros.a2.nombre=A2 de prueba
companeros.a2.url=http://localhost:1
companeros.a2.ruta-disparo-rapido=/api/reglas/disparo-rapido
companeros.a3.nombre=A3 de prueba
companeros.a3.url=http://localhost:1
companeros.a3.ruta-danio=/api/reglas/danio
